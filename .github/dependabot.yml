version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      frontend-deps:
        patterns: ["*"]
    ignore:
      # postcss is pinned by an overrides entry that remediates vulnerable CRA
      # transitives. The override and the direct devDependency cannot be
      # reconciled, so Dependabot fails the whole run with "Override for
      # postcss@... conflicts with direct dependency" and its grouped PR does
      # not install (npm EOVERRIDE). Renovate still proposes postcss updates.
      - dependency-name: "postcss"
    labels:
      - "dependencies"

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      backend-deps:
        patterns: ["*"]
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    labels:
      - "dependencies"
